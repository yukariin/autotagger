[project]
name = "autotagger"
version = "1.0"
description = "Danbooru autotagger"
authors = [{ name = "evazion", email = "noizave@gmail.com" }]
license = "MIT"
requires-python = ">=3.9,<3.13"
dependencies = [
    "Flask>=2.1.2",
    "python-dotenv>=0.20.0",
    "click>=8.1.3",
    "gunicorn>=21.2.0",
    "more-itertools>=8.13.0",
    "onnxruntime>=1.17.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
