[project]
name = "autotagger"
version = "1.0"
description = "Danbooru autotagger"
authors = [{ name = "evazion", email = "noizave@gmail.com" }]
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
    "click>=8.2,<9",
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "huggingface-hub>=1.3,<2",
    "more-itertools>=10.7,<11",
    "numpy>=2.2,<3",
    "openvino==2026.2.1",
    "pillow>=11.3,<13",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
